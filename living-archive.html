:root{--paper:#fff;--ink:#0c111b;--muted:#727b8a;--accent:#355bff;--accent-dark:#2344d6;--soft:#f1f4fa;--blue-soft:#e9efff;--ui-font:'Helvetica Neue',Helvetica,Arial,sans-serif;--mono:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:var(--ui-font);font-size:15px;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit;color:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:0;border-radius:12px;box-shadow:none;font-weight:600;background:var(--soft)}button:hover{background:#e4eaf6}button:disabled{opacity:.4;cursor:default}a{color:inherit;text-decoration:none}a:hover{color:var(--accent)}button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}h1,h2,h3,p,figure{margin:0}h1,h2,h3{font-weight:800}.micro{font:10px/1.5 var(--mono);letter-spacing:.04em;color:var(--muted)}.muted{color:var(--muted)}
.masthead{position:fixed;inset:0 0 auto;z-index:20;height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;background:#fff;gap:24px}.brand{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:700;letter-spacing:-.01em}.brand-glyph{font-family:Unread;font-size:27px;font-weight:400;color:var(--accent);width:34px;height:34px;display:flex;align-items:center;justify-content:center}.type-nav{display:flex;gap:6px}.type-nav a{font-size:13px;font-weight:600;padding:10px 16px;border-radius:12px}.type-nav a:hover{background:var(--blue-soft);color:var(--accent)}
.page{height:100dvh;overflow-x:hidden;overflow-y:auto;scroll-behavior:smooth;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior-y:contain}.page::-webkit-scrollbar{display:none}.slide{height:100dvh;min-height:100dvh;max-height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;padding:94px 7vw 64px 5vw;overflow:hidden}.slide-body{width:100%;max-width:1440px;margin:auto;max-height:calc(100dvh - 158px);overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;scrollbar-width:thin;min-height:0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:30px}.section-head h2{font-size:clamp(46px,6vw,96px);line-height:1;letter-spacing:-.06em;font-weight:900}.section-head>.micro,.family-intro,.comparison-note,.specimen-caption,.settings-note{display:none}
#intro-slide .slide-body{max-width:1440px;overflow:visible}.interface-hero{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:5vw}.interface-kicker{font:11px/1.5 var(--mono);letter-spacing:.05em;color:var(--accent);margin-bottom:26px}.interface-copy h1{font-size:clamp(80px,9.5vw,156px);font-weight:900;line-height:.86;letter-spacing:-.075em;margin-bottom:30px}.interface-intro{font-size:18px;line-height:1.6;letter-spacing:-.02em;color:#606b7d;max-width:440px}.interface-links{display:flex;align-items:center;gap:24px;margin-top:30px;flex-wrap:wrap}.interface-enter{background:var(--accent);color:#fff;font-size:15px;font-weight:700;padding:16px 24px;border-radius:12px;display:inline-block}.interface-enter:hover{background:var(--accent-dark);color:#fff}.interface-try{font-size:14px;font-weight:600}.interface-facts{display:flex;gap:30px;margin-top:40px}.interface-facts span{display:flex;flex-direction:column;gap:7px;font:10px/1.4 var(--mono);color:#8b93a1}.interface-facts b{font:700 22px/1 var(--ui-font);color:var(--ink);letter-spacing:-.04em}.portal-module{min-width:0}.portal-visual{position:relative;background:#0b1425;border-radius:32px;aspect-ratio:1/1;max-height:64dvh;overflow:hidden}.portal-art{width:100%;height:100%;display:block}.portal-corner{position:absolute;font:9px/1 var(--mono);letter-spacing:.08em;color:#7b94bd}.top-left{top:24px;left:24px}.bottom-right{right:24px;bottom:24px}.portal-caption{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font:9px/1.4 var(--mono);letter-spacing:.06em;color:#798599}.portal-caption>span:nth-child(2){color:var(--accent);font-size:20px}.portal-scan{position:absolute;left:10%;right:10%;height:1px;top:18%;background:#668cff;opacity:.7;box-shadow:0 0 10px #4b77ff;animation:scan 6s ease-in-out infinite alternate;pointer-events:none}@keyframes scan{from{transform:translateY(0);opacity:.15}50%{opacity:.7}to{transform:translateY(32vh);opacity:.2}}
#hello-slide{padding-left:5vw;padding-right:5vw}#hello-slide .slide-body{max-width:none;overflow:visible}.hello-screen{display:flex;align-items:center;justify-content:center;min-height:calc(100dvh - 158px);width:100%}#hello-title.script-greeting{position:relative;width:90%;height:calc((100dvh - 158px)*.9);margin:0 auto;line-height:1;padding:0}.hello-script{display:block;width:100%;height:100%;overflow:visible;opacity:1;transition:opacity 220ms ease}.hello-translation{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--ui-font);font-size:clamp(90px,min(25.2vw,32.4dvh),360px);font-weight:900;line-height:.82;letter-spacing:-.075em;color:var(--ink);opacity:0;transition:opacity 220ms ease;pointer-events:none}#hello-title.show-translation .hello-script{opacity:0}#hello-title.show-translation .hello-translation{opacity:1}

</style></head><body><header class="masthead"><a class="brand" href="index.html"><span class="brand-glyph" aria-hidden="true">H</span><span>LITHOSCRIPT</span></a><nav class="type-nav" aria-label="Typeface sections"><a href="index.html#family">Styles</a><a href="index.html#typeface">Try</a><a href="index.html#about">About</a><a href="https://ella-space1.github.io/Thesis-Prototype1/" target="_blank" rel="noopener noreferrer">Prototype I ↗</a><a href="download.html">Download ↓</a><a href="living-archive.html">Living Archive</a></nav></header><main class="archive-view"><header class="archive-toolbar"><h1>Living Archive</h1><select id="contents" aria-label="Contents"></select></header><div id="book" class="book" aria-live="polite"></div><div class="archive-progress" aria-hidden="true"><span id="bookProgress"></span></div><nav class="book-controls" aria-label="Book pages"><button id="bookPrevious">← Previous</button><span id="readingPosition"></span><button id="bookNext">Next →</button></nav></main><script>const pages=[{"section":"Cover","title":"Lithoscript","html":"<div class=\"cover\"><img src=\"assets/archive-page-0-image-1.webp\" alt=\"Lithoscript cover: wood, leaves and berries framed by brackets\"></div>"},{"section":"Blank","title":"Blank","html":"<article aria-label=\"Blank page\"></article>"},{"section":"Chapter 1","title":"Chapter 1","html":"<article><div class=\"folio-label\">LITHOSCRIPT / PROCESS</div><h2>Chapter 1</h2><p>This book documents the process behind a project called Lithoscript.</p><p>Lithoscript began with my curiosity about other worlds and languages.</p><p>I was fascinated by how cultures differ from country to country, and how every language carries its culture within it. This made me wonder whether people would believe in a fictional culture and language if they were designed with enough care and consistency. In Avatar and other fantasy works, audiences often become deeply immersed in the world they encounter. I believe that a well-developed setting and language play a major role in creating that immersion. I began Lithoscript out of this curiosity and a desire to explore it.</p></article>"},{"section":"Chapter 2","title":"Chapter 2","html":"<article><div class=\"folio-label\">LITHOSCRIPT / PROCESS</div><h2>Chapter 2</h2><p>Lithoscript combines litho-, meaning “stone,” with script, meaning “writing.” I chose the name to mean “letters carved in stone” or “records on stone.”</p><p>In the village I imagined, language takes two forms: “words that remain” and “words that move.” In almost every culture, language is used both to keep records and to communicate through conversation. This is also true in my fictional culture, although the forms that language takes are slightly different. I decided to develop its written form.</p><p>“Words that remain” are used on signposts along the paths people travel and in records that need to last. These records need to be read by many people and survive exposure to the elements over time. For this reason, I chose stone as the surface on which to leave them.</p></article>"},{"section":"Process images","title":"Prototype I — Process images","html":"<article><div class=\"folio-label\">LITHOSCRIPT / PROTOTYPE I</div><figure style=\"margin:0 0 20px\"><img src=\"assets/archive-page-4-image-1.webp\" alt=\"Forest symbol applied to stone in Photoshop\" style=\"display:block;width:100%;height:auto;max-height:none\"></figure><figure style=\"margin:0 0 20px\"><img src=\"assets/archive-page-4-image-2.webp\" alt=\"Forest symbol detail on the Prototype I website\" style=\"display:block;width:100%;height:auto;max-height:none\"></figure></article>"},{"section":"Chapter 3","title":"Chapter 3","html":"<article><div class=\"folio-label\">LITHOSCRIPT / PROCESS</div><h2>Chapter 3</h2><p>Prototype I marked the beginning of this larger project. At first, I focused on developing the culture in depth. Since this was a year-long project to design a culture and language, I felt that it needed a solid cultural foundation. I began by asking what kind of landscape these people lived in, who they were, why they had gathered there and how their village had come into being. More details about the village can be found on the Prototype I website.</p><p>The first language I designed in Prototype I consisted of words made by combining four basic signs. I chose the elements that mattered most to an agricultural village as the foundation. The idea that the necessities of life formed the language also implied the religious nature of the community.</p><p>At this stage, I struggled to build a broad vocabulary from combinations of only four elements. I also encountered the limits of a structure made up of words alone when I tried to develop the particles, adjectives and other grammatical elements needed to form sentences. I decided to let go of the method of combining elements to create new words and instead change direction toward transforming an existing language into a new one.</p></article>"},{"section":"Chapter 4","title":"Chapter 4","html":"<article><div class=\"folio-label\">LITHOSCRIPT / PROCESS</div><h2>Chapter 4</h2><p>As I began Prototype II, I took my professor’s feedback seriously: creating a language within a three-week project was unrealistic. I substantially narrowed the scope to designing a typeface.</p><p>I still found it difficult to let go of the ambition to create a language. Rather than simply choosing runic letters as the base forms, I kept the four elements I had already developed and used them to reshape the runes into new forms.</p><p>To turn these letters into a typeface, I considered tools and pigments that could plausibly be found in the culture I had imagined. I chose wood and a range of natural inks and pigments as the variables that would change the typeface.</p><p>To develop the basic forms of the Lithoscript typeface, I carved a wooden pen, made an ink from coffee beans and wrote the letters by hand. The forms changed depending on the concentration of the ink, the points where strokes began and ended, the junctions where strokes met and how frequently I dipped the pen.</p><p>After trying several approaches, I found an ink concentration and a way of joining strokes that felt comfortable and natural to write with while dipping the pen. I used these as the underlying structure of the Lithoscript typeface.</p></article>"},{"section":"Chapter 5","title":"Chapter 5","html":"<article><div class=\"folio-label\">LITHOSCRIPT / PROCESS</div><h2>Chapter 5</h2><p>Once the underlying structure of the typeface was established, it became easier to explore different tools and inks. Using Procreate on my iPad, I customised brushes to adjust the tip shapes and ink densities of the tools I imagined. I then used these custom brushes to create several stylistic versions.</p><p>I traced the outlines in Illustrator, then used a font-making app to map the characters directly to Latin alphabet keys and export them as TTF files.</p><figure style=\"margin-top:24px\"><img src=\"assets/archive-page-7-image-1.webp\" alt=\"Customising a textured brush in Procreate on an iPad\" style=\"width:100%;height:auto;max-height:none;display:block\"></figure></article>"},{"section":"Specimens","title":"Writing styles and inks","html":"<article class=\"specimen-sheet\"><div class=\"folio-label\">LITHOSCRIPT / WRITING STYLES & INKS</div><div class=\"specimen-six-grid\"><figure><img src=\"assets/archive-page-8-image-1.webp\" alt=\"Writing style specimen 1\"><figcaption>Fine wooden nib</figcaption></figure><figure><img src=\"assets/archive-page-8-image-2.webp\" alt=\"Writing style specimen 2\"><figcaption>Round wooden nib</figcaption></figure><figure><img src=\"assets/archive-page-8-image-3.webp\" alt=\"Writing style specimen 3\"><figcaption>Plant-fibre brush</figcaption></figure><figure><img src=\"assets/archive-page-8-image-4.webp\" alt=\"Writing style specimen 4\"><figcaption>Flat wooden nib</figcaption></figure><figure><img src=\"assets/archive-page-8-image-5.webp\" alt=\"Writing style specimen 5\"><figcaption>Pointed wooden nib</figcaption></figure><figure><img src=\"assets/archive-page-8-image-6.webp\" alt=\"Four ink variations\"><figcaption>Ink variations</figcaption></figure></div></article>"},{"section":"Chapter 6","title":"Chapter 6","html":"<article><div class=\"folio-label\">LITHOSCRIPT / PROCESS</div><h2>Chapter 6</h2><p>This project began with a simple curiosity and developed through my desire to explore it. I hope it can encourage others with similar interests to develop worlds of their own. I also hope that people building worlds similar to mine might use Lithoscript to help bring those worlds into visual form.</p></article>"},{"section":"Blank","title":"Blank","html":"<article aria-label=\"Blank page\"></article>"}];let current=0;const book=document.getElementById('book'),toc=document.getElementById('contents'),previous=document.getElementById('bookPrevious'),next=document.getElementById('bookNext');const mobile=()=>window.innerWidth<=700;pages.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i===0?'Cover':String(i).padStart(2,'0'))+' — '+p.title;toc.append(o)});function renderBook(){const count=current===0||mobile()?1:2;book.replaceChildren();for(let i=current;i<Math.min(pages.length,current+count);i++){const leaf=document.createElement('section');leaf.className='leaf'+(i===0?' cover-leaf':'');leaf.tabIndex=0;leaf.setAttribute('aria-label',i===0?'Cover':'Page '+i+': '+pages[i].title);leaf.innerHTML=pages[i].html+(i&&pages[i].section!=='Blank'?'<span class="folio">'+String(i).padStart(2,'0')+'</span>':'');const article=leaf.querySelector('article');if(article&&article.querySelector('figure'))article.classList.add(article.querySelector('p')?'has-photo':'photo-page');book.append(leaf)}requestAnimationFrame(fitBookPages);previous.disabled=current===0;next.disabled=current+count>=pages.length;toc.value=current;document.getElementById('readingPosition').textContent=current===0?'COVER / '+(pages.length-1)+' PAGES':String(current).padStart(2,'0')+(count===2&&current+1<pages.length?'–'+String(current+1).padStart(2,'0'):'')+' / '+(pages.length-1);document.getElementById('bookProgress').style.width=((current+count)/pages.length*100)+'%';location.replace('#page-'+current)}
function fitBookPages(){for(const leaf of book.querySelectorAll('.leaf')){const article=leaf.querySelector('article');if(!article)continue;article.style.fontSize='';const ps=[...article.querySelectorAll('p')],heading=article.querySelector('h2');ps.forEach(p=>{p.style.fontSize='';p.style.lineHeight='';p.style.marginBottom=''});if(heading){heading.style.fontSize='';heading.style.marginBottom=''}const fits=()=>article.scrollHeight<=article.clientHeight+1&&leaf.scrollHeight<=leaf.clientHeight+1;for(let step=0;step<18&&!fits();step++){const scale=1-(step+1)*.025;ps.forEach(p=>{p.style.fontSize=(15*scale)+'px';p.style.lineHeight='1.5';p.style.marginBottom=(16*scale)+'px'});if(heading){heading.style.fontSize=(32*scale)+'px';heading.style.marginBottom=(24*scale)+'px'}}}}
function turn(dir){if(dir>0){if(next.disabled)return;current+=current===0||mobile()?1:2}else{if(previous.disabled)return;current=mobile()?current-1:current<=2?0:current-2}renderBook()}previous.onclick=()=>turn(-1);next.onclick=()=>turn(1);toc.onchange=()=>{current=Number(toc.value);renderBook()};window.addEventListener('keydown',e=>{if(e.target.closest('select,input,textarea'))return;if(e.key==='ArrowRight'){e.preventDefault();turn(1)}if(e.key==='ArrowLeft'){e.preventDefault();turn(-1)}});let sx=0,sy=0;book.addEventListener('load',()=>requestAnimationFrame(fitBookPages),true);book.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});book.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)turn(dx<0?1:-1)},{passive:true});window.addEventListener('resize',renderBook);const match=location.hash.match(/page-(\d+)/);if(match)current=Math.min(pages.length-1,Number(match[1]));renderBook();</script></body></html>
